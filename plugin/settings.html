<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一二 HD 配置</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4f6ef7;
      --accent-soft: #eef1ff;
      --danger: #b42318;
      --warn-bg: #fff8e6;
      --warn-line: #f0d58a;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; color: var(--text); }
    body {
      font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 4px 2px 18px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .head { display: flex; align-items: center; gap: 10px; margin: 2px 0 4px; }
    .head h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .01em; }
    .badge {
      font-size: 11px; color: var(--accent); background: var(--accent-soft);
      border: 1px solid #dbe2ff; border-radius: 999px; padding: 1px 8px;
    }
    .hint { color: var(--muted); margin: 0 0 12px; font-size: 12px; }
    .warn {
      display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
      background: var(--warn-bg); border: 1px solid var(--warn-line); color: #7a4b00;
      font-size: 12px; white-space: pre-wrap;
    }
    .warn.on { display: block; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 14px 12px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    .field { margin: 0 0 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 5px; }
    .field .sub { font-weight: 400; color: var(--muted); margin-left: 6px; }
    select, input[type="number"], input[type="text"] {
      width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; color: var(--text); outline: none;
      font: inherit;
    }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.12); }
    .row { display: flex; gap: 10px; }
    .row > .field { flex: 1; margin-bottom: 0; }
    .sizerow { display: flex; align-items: center; gap: 10px; }
    .sizerow input[type="range"] { flex: 1; accent-color: var(--accent); }
    .sizerow input[type="number"] { width: 78px; text-align: right; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .presets button, .btn {
      font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--text); padding: 6px 10px;
    }
    .presets button:hover, .btn:hover { border-color: #c9d1e6; background: #fafbff; }
    .actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.primary:hover { background: #4361e8; }
    .btn:disabled { opacity: .55; cursor: default; }
    .status { color: var(--muted); font-size: 12px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .preview {
      background: conic-gradient(#e6e9ef 25%, #f7f8fa 0 50%, #e6e9ef 0 75%, #f7f8fa 0) 0 0 / 18px 18px;
      border-radius: 12px; border: 1px solid var(--line); overflow: hidden;
      min-height: 220px; display: flex; align-items: center; justify-content: center;
    }
    .preview video { display: block; width: 280px; max-width: 100%; height: auto; }
    .preview .fallback { color: var(--muted); font-size: 12px; padding: 18px; text-align: center; }
    .path { margin: 6px 0 0; color: var(--muted); font-size: 11px; word-break: break-all; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    pre {
      margin: 8px 0 0; padding: 10px; background: #0f172a; color: #d7e2ff;
      border-radius: 10px; overflow: auto; font-size: 11px; line-height: 1.5; max-height: 260px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>一二 HD</h1>
    <span class="badge">pet pack · 独立配置</span>
  </div>
  <p class="hint">这里只改 <code>yier-hd-config.json</code> 的显示位置、大小和边距；动画池等高级字段请直接编辑 JSON。保存后会触发热重载。</p>
  <div id="warn" class="warn"></div>
  <div class="grid">
    <div class="card">
      <div class="field">
        <label>显示位置</label>
        <select id="display">
          <option value="web">web — 只显示在 DSH 网页</option>
          <option value="desktop">desktop — 只显示在桌面透明窗</option>
          <option value="both">both — 网页 + 桌面</option>
          <option value="none">none — 隐藏</option>
        </select>
      </div>

      <div class="field">
        <label>大小 <span class="sub">舞台宽度 px</span></label>
        <div class="sizerow">
          <input id="size" type="range" min="160" max="600" step="10" value="280">
          <input id="sizeNum" type="number" min="120" max="800" step="10" value="280">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>角落</label>
          <select id="corner">
            <option value="top-left">左上</option>
            <option value="top-right">右上</option>
            <option value="bottom-left">左下</option>
            <option value="bottom-right">右下</option>
          </select>
        </div>
        <div class="field">
          <label>快捷布局</label>
          <div class="presets">
            <button data-preset="top-left">左上</button>
            <button data-preset="top-right">右上</button>
            <button data-preset="bottom-left">左下</button>
            <button data-preset="bottom-right">右下</button>
          </div>
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <div class="field">
          <label>水平边距 <span class="sub">marginX</span></label>
          <input id="marginX" type="number" step="1" value="24">
        </div>
        <div class="field">
          <label>垂直边距 <span class="sub">marginY</span></label>
          <input id="marginY" type="number" step="1" value="160">
        </div>
      </div>

      <div class="actions">
        <button id="save" class="btn primary">保存并重载</button>
        <button id="reset" class="btn">恢复默认布局</button>
        <span id="status" class="status"></span>
      </div>
      <p class="path" id="path"></p>
    </div>

    <div>
      <div class="preview">
        <video id="preview" src="/dsh-pet-7340/thumb/yier-hd/待机HD.webm" muted autoplay loop playsinline></video>
        <div id="previewFallback" class="fallback" style="display:none">预览加载失败<br>（dsh-pet 未安装或素材未就绪）</div>
      </div>
      <p class="path">预览：待机HD（实际大小会随上方 size 变化）</p>
    </div>
  </div>

  <details>
    <summary>当前配置 JSON</summary>
    <pre id="json"></pre>
  </details>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { config: null, status: null };

  function setStatus(text, kind) {
    var el = $('status');
    el.textContent = text || '';
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function api(path, opts) {
    var r = await fetch(path, opts || {});
    var text = await r.text();
    var body = null;
    try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
    if (!r.ok) throw new Error((body && body.reason) || ('HTTP ' + r.status));
    return body;
  }

  function fillForm() {
    var p = state.config.pets[0];
    $('display').value = p.display;
    $('size').value = p.size;
    $('sizeNum').value = p.size;
    $('corner').value = p.position.corner;
    $('marginX').value = p.position.marginX;
    $('marginY').value = p.position.marginY;
    updatePreview();
    $('json').textContent = JSON.stringify(state.config, null, 2);
  }

  function updatePreview() {
    var size = Number($('sizeNum').value) || 280;
    $('preview').style.width = size + 'px';
  }

  function patchFromForm() {
    return {
      display: $('display').value,
      size: Number($('sizeNum').value),
      corner: $('corner').value,
      marginX: Number($('marginX').value),
      marginY: Number($('marginY').value)
    };
  }

  async function load() {
    setStatus('正在读取配置…');
    try {
      var s = await api('/one-two-pet/status');
      state.status = s;
      state.config = s.config;
      $('path').textContent = '配置：' + s.petDir + '\\yier-hd-config.json';
      if (!s.dshPet) {
        var w = $('warn');
        w.textContent = '没有检测到 dsh-pet（' + s.petDir + ' 的上一级不存在）。\\n' +
          '请先安装 dsh-pet，否则这个 pet pack 不会被渲染。配置仍会保存。';
        w.classList.add('on');
      }
      fillForm();
      setStatus('已加载', 'ok');
    } catch (e) {
      setStatus('读取失败：' + e.message, 'err');
    }
  }

  async function save() {
    var btn = $('save');
    btn.disabled = true;
    setStatus('正在保存…');
    try {
      var res = await api('/one-two-pet/config', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(patchFromForm())
      });
      state.config = res.config;
      fillForm();
      var reload = await api('/one-two-pet/reload', { method: 'POST' });
      if (reload.reload && reload.reload.ok) setStatus('已保存，并已触发热重载', 'ok');
      else setStatus('已保存；热重载未成功，请刷新 DSH 页面', 'err');
    } catch (e) {
      setStatus('保存失败：' + e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  $('size').addEventListener('input', function () {
    $('sizeNum').value = $('size').value;
    updatePreview();
  });
  $('sizeNum').addEventListener('input', function () {
    $('size').value = $('sizeNum').value;
    updatePreview();
  });
  $('save').addEventListener('click', save);
  $('reset').addEventListener('click', function () {
    $('display').value = 'web';
    $('size').value = 280;
    $('sizeNum').value = 280;
    $('corner').value = 'top-left';
    $('marginX').value = 24;
    $('marginY').value = 160;
    updatePreview();
    setStatus('已恢复表单默认值，点「保存并重载」生效');
  });
  document.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () {
      $('corner').value = b.getAttribute('data-preset');
      $('marginX').value = 24;
      $('marginY').value = 160;
    });
  });
  $('preview').addEventListener('error', function () {
    $('preview').style.display = 'none';
    $('previewFallback').style.display = 'block';
  });

  load();
})();
</script>
</body>
</html>
